<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Траты</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#16232E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Траты">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#E9EEF2; --paper:#FFFFFF; --ink:#16232E; --muted:#6B7A86;
  --line:#D5DDE3; --accent:#2F5D8A; --ok:#3C8D6E; --warn:#D08A1E; --over:#C23B2E;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,"SF Pro Text","Roboto","Segoe UI",sans-serif;
  font-variant-numeric:tabular-nums;padding:16px 14px 40px;max-width:520px;margin:0 auto}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month h1{font-size:20px;font-weight:650;text-transform:capitalize}
.month button{width:40px;height:40px;border-radius:50%;background:var(--paper);font-size:20px}

.total{background:var(--ink);color:#fff;border-radius:18px;padding:18px 18px 16px;margin-bottom:14px}
.total .spent{font-size:40px;font-weight:700;letter-spacing:-1px}
.total .of{color:#A9B7C3;font-size:15px}
.bar{height:8px;border-radius:4px;background:rgba(255,255,255,.15);margin:12px 0 8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.total .left{font-size:15px}

.entry{background:var(--paper);border-radius:18px;padding:16px;margin-bottom:14px}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--line);padding-bottom:6px;margin-bottom:12px}
.amount input{border:0;font-size:34px;font-weight:700;width:100%;background:none;color:var(--ink)}
.amount span{font-size:28px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:9px 12px;border-radius:12px;background:var(--bg);font-size:14px}
.chip[aria-pressed=true]{background:var(--accent);color:#fff}
.row{display:flex;gap:8px;margin-bottom:12px}
.row input,.row select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.save{width:100%;padding:14px;border-radius:12px;background:var(--accent);color:#fff;font-weight:650;font-size:17px}
.save:disabled{opacity:.4}
.msg{min-height:20px;font-size:14px;color:var(--muted);text-align:center;margin-top:8px}

h2{font-size:17px;font-weight:650;margin:22px 4px 10px}
.cat{background:var(--paper);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.cat .top{display:flex;justify-content:space-between;gap:8px;font-size:15px}
.cat .top b{font-weight:600}
.cat .bar{background:var(--bg);height:6px;margin:8px 0 0}
.cat small{color:var(--muted)}

.list{background:var(--paper);border-radius:14px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .d{font-size:13px;color:var(--muted)}
.item .sum{font-weight:650;white-space:nowrap}
.item button{color:var(--muted);font-size:20px;padding:0 4px}
.empty{padding:18px;color:var(--muted);text-align:center}

.limits{display:none}
.limits.open{display:block}
.lim{display:flex;justify-content:space-between;align-items:center;background:var(--paper);border-radius:12px;padding:8px 12px;margin-bottom:6px}
.lim input{width:110px;text-align:right;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit}
.link{color:var(--accent);font-size:15px;padding:8px 4px;cursor:pointer;display:inline-block}
.backup{display:flex;flex-wrap:wrap;gap:6px 18px}
body{padding-top:max(16px,env(safe-area-inset-top))}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .3s}}
</style>
</head>
<body>

<div class="month">
  <button id="prev" aria-label="Предыдущий месяц">‹</button>
  <h1 id="mname"></h1>
  <button id="next" aria-label="Следующий месяц">›</button>
</div>

<section class="total">
  <div class="spent" id="spent">0 ₽</div>
  <div class="of" id="of"></div>
  <div class="bar"><i id="tbar"></i></div>
  <div class="left" id="left"></div>
</section>

<section class="entry">
  <label class="amount"><input id="amt" type="number" inputmode="decimal" placeholder="0" aria-label="Сумма"><span>₽</span></label>
  <div class="chips" id="chips"></div>
  <div class="row">
    <input id="note" placeholder="Где / что (необязательно)">
  </div>
  <div class="row">
    <select id="card" aria-label="Карта">
      <option>Т-Банк кредитка</option><option>Т-Банк дебет</option><option>Сбер</option><option>Наличные</option>
    </select>
    <input id="date" type="date" aria-label="Дата">
  </div>
  <button class="save" id="save" disabled>Записать</button>
  <div class="msg" id="msg"></div>
</section>

<h2>По категориям</h2>
<div id="cats"></div>
<button class="link" id="limBtn">Изменить лимиты</button>
<div class="limits" id="limits"></div>

<h2>Записи за месяц</h2>
<div class="list" id="list"></div>

<h2>Синхронизация</h2>
<div class="entry">
  <div id="syncStatus" style="font-size:14px;margin-bottom:10px"></div>
  <div id="syncForm">
    <div class="row"><input id="ghOwner" placeholder="Логин GitHub" autocapitalize="off" autocorrect="off"></div>
    <div class="row"><input id="ghRepo" value="traty-data" placeholder="Приватный репозиторий" autocapitalize="off" autocorrect="off"></div>
    <div class="row"><input id="ghToken" type="password" placeholder="Токен github_pat_…" autocapitalize="off" autocorrect="off"></div>
    <button class="save" id="ghConnect">Подключить</button>
  </div>
  <div id="syncOn" hidden>
    <div id="syncWho" style="margin-bottom:10px"></div>
    <button class="save" id="ghNow">Синхронизировать сейчас</button>
    <button class="link" id="ghOff">Отключить на этом устройстве</button>
  </div>
</div>

<h2>Резервная копия</h2>
<div class="backup">
  <button class="link" id="exp">Сохранить копию в файл</button>
  <label class="link" for="imp">Восстановить из файла</label>
  <input type="file" id="imp" accept="application/json,.json" hidden>
</div>

<script>
const DEFAULT_LIMITS = {
  "Продукты":10000, "Кафе и фастфуд":8000, "Транспорт":3500, "Авто и бензин":3000,
  "Аптеки":2000, "Развлечения и игры":4000, "Дом, одежда, прочее":3000,
  "Переводы людям":8000, "Учёба":2000
};
let state = { entries: [], deleted: [], limits: {...DEFAULT_LIMITS}, limitsAt: 0 };
let view = new Date(); view.setDate(1);
let picked = null;

const $ = id => document.getElementById(id);
const rub = n => Math.round(n).toLocaleString('ru-RU') + ' ₽';
const ym = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0');
const today = () => { const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const color = p => p > 1 ? 'var(--over)' : p > .8 ? 'var(--warn)' : 'var(--ok)';

function fromObj(o){ return { entries:o.entries||[], deleted:o.deleted||[], limits:{...DEFAULT_LIMITS, ...(o.limits||{})}, limitsAt:o.limitsAt||0 }; }
function load(){
  try{ const raw = localStorage.getItem('traty-data'); if (raw) state = fromObj(JSON.parse(raw)); }
  catch(e){ $('msg').textContent = 'Не удалось прочитать данные. Восстановите их из резервной копии.'; }
  render();
}
function saveLocal(){
  try{ localStorage.setItem('traty-data', JSON.stringify(state)); return true; }
  catch(e){ $('msg').textContent = 'Не удалось сохранить: в браузере закончилось место или запрещено хранение.'; return false; }
}
async function persist(){ const ok = saveLocal(); if(ok) scheduleSync(); return ok; }

/* ---------- Синхронизация через приватный репозиторий GitHub ---------- */
let sync = null;
try{ sync = JSON.parse(localStorage.getItem('traty-sync')||'null'); }catch(e){}
let syncing=false, again=false, timer=null;
const b64e = str => { const by=new TextEncoder().encode(str); let bin=''; for(const x of by) bin+=String.fromCharCode(x); return btoa(bin); };
const b64d = str => new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g,'')), c=>c.charCodeAt(0)));
function canon(o){
  return JSON.stringify({ entries:[...o.entries].sort((x,y)=>x.id-y.id), deleted:[...new Set(o.deleted)].sort((x,y)=>x-y), limits:o.limits, limitsAt:o.limitsAt });
}
function merge(a,b){
  const del = new Set([...(a.deleted||[]),...(b.deleted||[])]);
  const map = new Map();
  [...(b.entries||[]),...(a.entries||[])].forEach(e=>{ if(!del.has(e.id)) map.set(e.id,e); });
  const newer = (a.limitsAt||0) >= (b.limitsAt||0) ? a : b;
  return fromObj({ entries:[...map.values()], deleted:[...del], limits:newer.limits, limitsAt:newer.limitsAt });
}
function setStatus(t, bad){ const el=$('syncStatus'); el.textContent=t; el.style.color = bad ? 'var(--over)' : 'var(--muted)'; }
function gh(path, method='GET', body){
  return fetch('https://api.github.com/repos/' + sync.owner + '/' + sync.repo + path, {
    method, cache:'no-store',
    headers:{ 'Authorization':'Bearer '+sync.token, 'Accept':'application/vnd.github+json', ...(body?{'Content-Type':'application/json'}:{}) },
    body: body ? JSON.stringify(body) : undefined
  });
}
function explain(e){
  if(e==401) return 'Токен неверный или истёк. Создайте новый и подключитесь заново.';
  if(e==403) return 'У токена нет прав на запись (нужно Contents: Read and write).';
  if(e==404) return 'Репозиторий не найден или токен к нему не допущен.';
  return 'Нет связи с GitHub. Записи сохранены на телефоне, синхронизирую позже.';
}
function scheduleSync(){ if(!sync) return; clearTimeout(timer); timer=setTimeout(doSync, 800); }
async function doSync(){
  if(!sync) return;
  if(syncing){ again=true; return; }
  syncing=true; setStatus('Синхронизация…');
  try{
    for(let i=0;i<3;i++){
      const r = await gh('/contents/data.json');
      let remote = fromObj({}), sha;
      if(r.status===200){ const j=await r.json(); sha=j.sha; remote=fromObj(JSON.parse(b64d(j.content))); }
      else if(r.status!==404) throw r.status;
      state = merge(state, remote); saveLocal(); render();
      const out = canon(state);
      if(sha && out===canon(remote)) break;
      const p = await gh('/contents/data.json','PUT',{ message:'sync ' + new Date().toISOString(), content:b64e(out), ...(sha?{sha}:{}) });
      if(p.ok) break;
      if(p.status===409 || p.status===422) continue;   // кто-то записал одновременно — повторяем
      throw p.status;
    }
    setStatus('Синхронизировано в ' + new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){ setStatus(explain(e), true); }
  finally{ syncing=false; if(again){ again=false; doSync(); } }
}
async function connect(){
  const owner=$('ghOwner').value.trim(), repo=$('ghRepo').value.trim(), token=$('ghToken').value.trim();
  if(!owner||!repo||!token){ setStatus('Заполните все три поля.', true); return; }
  sync = {owner, repo, token}; setStatus('Проверяю доступ…');
  try{
    const r = await gh('');
    if(!r.ok) throw r.status;
    localStorage.setItem('traty-sync', JSON.stringify(sync));
    $('ghToken').value=''; renderSync(); doSync();
  }catch(e){ sync=null; setStatus(explain(e), true); }
}
function disconnect(){
  if(!confirm('Отключить синхронизацию на этом устройстве? Записи на телефоне и в облаке останутся.')) return;
  sync=null; localStorage.removeItem('traty-sync'); renderSync(); setStatus('Синхронизация выключена на этом устройстве.');
}
function renderSync(){
  $('syncForm').hidden = !!sync; $('syncOn').hidden = !sync;
  if(sync) $('syncWho').textContent = 'Подключено: ' + sync.owner + '/' + sync.repo;
  else setStatus('Не подключено — записи хранятся только на этом устройстве.');
}

function exportData(){
  const blob = new Blob([JSON.stringify(state,null,1)],{type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'traty-backup-' + today() + '.json'; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function importData(file){
  const r = new FileReader();
  r.onload = ()=>{
    try{
      const s = JSON.parse(r.result);
      if(!Array.isArray(s.entries)) throw 0;
      if(!confirm('Добавить записи из копии (' + s.entries.length + ' шт.)? Совпадающие не задвоятся.')) return;
      state = merge(state, s);
      persist(); render(); $('msg').textContent = 'Данные восстановлены из копии.';
    }catch(e){ $('msg').textContent = 'Этот файл не похож на резервную копию трат.'; }
  };
  r.readAsText(file);
}

function renderChips(){
  $('chips').innerHTML = '';
  Object.keys(state.limits).forEach(c=>{
    const b = document.createElement('button');
    b.className='chip'; b.textContent=c; b.setAttribute('aria-pressed', picked===c);
    b.onclick=()=>{ picked=c; renderChips(); check(); };
    $('chips').appendChild(b);
  });
}
function check(){ $('save').disabled = !(parseFloat($('amt').value)>0 && picked); }

function render(){
  const key = ym(view);
  $('mname').textContent = view.toLocaleDateString('ru-RU',{month:'long',year:'numeric'});
  const month = state.entries.filter(e=>e.date.startsWith(key));
  const total = month.reduce((s,e)=>s+e.amount,0);
  const budget = Object.values(state.limits).reduce((s,v)=>s+v,0);
  const p = budget ? total/budget : 0;
  $('spent').textContent = rub(total);
  $('of').textContent = 'из ' + rub(budget) + ' на месяц';
  $('tbar').style.width = Math.min(p,1)*100+'%'; $('tbar').style.background = color(p);
  $('left').textContent = total<=budget ? 'Осталось ' + rub(budget-total) : 'Перерасход ' + rub(total-budget);

  const by = {}; month.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.amount);
  $('cats').innerHTML = Object.keys(state.limits).map(c=>{
    const s=by[c]||0, l=state.limits[c], q=l? s/l : (s?2:0);
    return `<div class="cat"><div class="top"><b>${c}</b><span>${rub(s)} <small>/ ${rub(l)}</small></span></div>
      <div class="bar"><i style="width:${Math.min(q,1)*100}%;background:${color(q)}"></i></div></div>`;
  }).join('');

  const sorted = [...month].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  $('list').innerHTML = sorted.length ? sorted.map(e=>`
    <div class="item"><div><div>${e.note ? esc(e.note) : e.cat}</div>
      <div class="d">${e.date.slice(8,10)}.${e.date.slice(5,7)} · ${e.cat} · ${e.card}</div></div>
      <div style="display:flex;align-items:center;gap:6px"><span class="sum">${rub(e.amount)}</span>
      <button aria-label="Удалить запись" onclick="del(${e.id})">×</button></div></div>`).join('')
    : '<div class="empty">В этом месяце записей нет. Введите сумму и выберите категорию выше.</div>';

  $('limits').innerHTML = Object.keys(state.limits).map(c=>`
    <label class="lim"><span>${c}</span><input type="number" inputmode="numeric" value="${state.limits[c]}" data-c="${c}"></label>`).join('');
  document.querySelectorAll('#limits input').forEach(i=>i.onchange=async()=>{
    state.limits[i.dataset.c] = Math.max(0, parseFloat(i.value)||0); state.limitsAt = Date.now(); await persist(); render();
  });
}
function esc(s){ return s.replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

async function del(id){
  const e = state.entries.find(x=>x.id===id);
  if(!e || !confirm('Удалить запись на ' + rub(e.amount) + '?')) return;
  state.entries = state.entries.filter(x=>x.id!==id); state.deleted.push(id); await persist(); render();
}

$('amt').oninput = check;
$('date').value = today();
$('save').onclick = async ()=>{
  const amount = parseFloat($('amt').value);
  const entry = { id: Date.now(), amount, cat: picked, note: $('note').value.trim(), card: $('card').value, date: $('date').value || today() };
  state.entries.push(entry);
  if(await persist()){
    $('msg').textContent = 'Записано: ' + rub(amount) + ', ' + picked;
    $('amt').value=''; $('note').value=''; picked=null; renderChips(); check();
    const d = new Date(entry.date); view = new Date(d.getFullYear(), d.getMonth(), 1);
    render();
  } else { state.entries.pop(); }
};
$('prev').onclick=()=>{ view.setMonth(view.getMonth()-1); render(); };
$('next').onclick=()=>{ view.setMonth(view.getMonth()+1); render(); };
$('limBtn').onclick=()=>{ const o=$('limits').classList.toggle('open'); $('limBtn').textContent = o ? 'Скрыть лимиты' : 'Изменить лимиты'; };

$('exp').onclick = exportData;
$('imp').onchange = e => { if(e.target.files[0]) importData(e.target.files[0]); e.target.value=''; };
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
$('ghConnect').onclick = connect;
$('ghNow').onclick = doSync;
$('ghOff').onclick = disconnect;
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') doSync(); });
window.addEventListener('online', doSync);
renderChips(); check(); load(); renderSync(); doSync();
</script>
</body>
</html>
